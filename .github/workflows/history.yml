name: Daily history snapshot

on:
  schedule:
    # About 10:15 AM America/Chicago in winter (CST, UTC-6); 11:15 AM in summer (CDT).
    - cron: "15 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull live prices and append today's point
        run: python3 scripts/update_history.py --snapshot
      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily spot snapshot ($(TZ=America/Chicago date +%F))"
            git push
          fi
